<div class="new-post">
    <button class="logout-btn" id="btn-logout">
        <a href="#login">Sair</a>
    </button>

    <input id="title-recipe"
     class="recipe-input" 
     placeholder="Nome da receita" 
     required/>
     
    <textarea id="recipe-content" 
    class="post-content" 
    placeholder="Postar nova receita" 
    maxlength="250" 
    required>
    </textarea>
    <span id="error-message" class="error-writepost"></span>
    <button class="post-btn" id="new-post-btn">Postar</button>
    <section class="show-posts" id="showPosts">
    </section>
  </div>
